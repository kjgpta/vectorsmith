# Local backends for development and conformance.
# Usage: docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vectorsmith
      POSTGRES_PASSWORD: vectorsmith
      POSTGRES_DB: vectorsmith
    ports:
      - "5432:5432"

  chroma:
    image: chromadb/chroma:1.5.0
    ports:
      - "8000:8000"

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.5
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: text2vec-transformers
      TRANSFORMERS_INFERENCE_API: http://text2vec-transformers:8080
      CLUSTER_HOSTNAME: node1
    depends_on:
      - text2vec-transformers

  text2vec-transformers:
    image: cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2
    environment:
      ENABLE_CUDA: "0"

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"

  pinecone-local:
    image: ghcr.io/pinecone-io/pinecone-local@sha256:0f944585830a30c37260ac6534c7c206280490947e1ddbb716474166b517b6c7
    environment:
      PORT: 5080
      PINECONE_HOST: localhost
    ports:
      - "5080-5090:5080-5090"
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
