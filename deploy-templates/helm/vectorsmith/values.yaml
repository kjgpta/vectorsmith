replicaCount: 2

image:
  repository: vectorsmith
  tag: "0.2.2"
  pullPolicy: IfNotPresent

toolsYaml: configMap
envFileSecret: vectorsmith-env

auth:
  mode: jwt
  jwksUrl: ""
  store: redis

redis:
  enabled: true
  url: redis://vectorsmith-redis:6379/0

ingress:
  enabled: true
  className: ""
  host: vectorsmith.example.com
  tls: true

probes:
  liveness: /healthz
  readiness: /readyz

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 70

pdb:
  enabled: true
  minAvailable: 1

service:
  port: 80
  targetPort: 8080

shutdownGraceSeconds: 30

serviceMonitor:
  enabled: false
