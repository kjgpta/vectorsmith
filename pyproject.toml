[project]
name = "vectorsmith-workspace"
version = "0.2.2"
description = "VectorSmith workspace root (not published)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/cli"]

[tool.uv.sources]
vectorsmith-core = { workspace = true }
vectorsmith = { workspace = true }

[dependency-groups]
dev = [
    "vectorsmith-core",
    "vectorsmith",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    "testcontainers>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "import-linter>=2.1",
    "langchain-core>=0.3",
    "PyJWT>=2.8",
    "cryptography>=42",
]
conformance = [
    "vectorsmith-core[qdrant,pgvector,chroma,pinecone,weaviate,milvus]",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/core", "packages/cli", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"**/tds/models.py" = ["S101", "UP007"]
"**/vectorsmith_cli/main.py" = ["B008"]
"**/adapters/*.py" = ["S101"]
"**/execute/engine.py" = ["S101"]
"**/ir/filter.py" = ["UP007"]
"**/compilepkg/builtins.py" = ["B023"]

[tool.ruff.lint.isort]
known-first-party = ["vectorsmith_core", "vectorsmith_cli", "vectorsmith"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "packages/core"
packages = ["vectorsmith_core"]

[[tool.mypy.overrides]]
module = [
    "chromadb",
    "psycopg",
    "psycopg_pool",
    "pinecone",
    "weaviate",
    "weaviate.*",
    "pymilvus",
    "openai",
    "cohere",
    "jsonschema",
    "qdrant_client",
    "qdrant_client.*",
    "fastembed",
    "opentelemetry",
    "opentelemetry.*",
    "redis",
    "redis.asyncio",
    "boto3",
    "sentence_transformers",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "conformance: adapter conformance tests (testcontainers)",
    "capability: direct positive or rejection evidence for a public capability",
    "fault: timeout, authentication, malformed-response, and cleanup contracts",
    "version: minimum, pinned, and newest-tested client boundary contracts",
]
