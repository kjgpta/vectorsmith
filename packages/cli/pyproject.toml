[project]
name = "vectorsmith"
version = "0.2.1"
description = "YAML tools for agents: load_tools in-process, or vectorsmith serve as MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "VectorSmith contributors" }]
keywords = ["mcp", "langchain", "langgraph", "claude", "codex", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml",
    "jsonschema",
    "polars>=1.0",
    "lark",
    "httpx",
    "typer",
    "watchfiles",
    "uvicorn",
    "starlette",
    "mcp>=2.0,<3",
    "argon2-cffi",
    "ruamel.yaml",
]

[project.urls]
Homepage = "https://github.com/kjgpta/vectorsmith"
Documentation = "https://kjgpta.github.io/vectorsmith/"
Issues = "https://github.com/kjgpta/vectorsmith/issues"
Changelog = "https://github.com/kjgpta/vectorsmith/blob/main/CHANGELOG.md"

[project.scripts]
vectorsmith = "vectorsmith_cli.main:app"

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.10.1", "fastembed>=0.3"]
pgvector = ["psycopg[binary,pool]>=3.2.1", "fastembed>=0.3"]
chroma = ["chromadb>=1.5,<2", "numpy<2", "fastembed>=0.3"]
pinecone = ["pinecone>=5.0", "fastembed>=0.3"]
weaviate = ["weaviate-client>=4.4", "fastembed>=0.3"]
milvus = ["pymilvus>=2.6", "fastembed>=0.3"]
langchain = ["langchain-core>=0.3"]
langgraph = ["langchain-core>=0.3", "langgraph>=0.2"]
openai-agents = ["openai-agents>=0.2"]
anthropic = ["anthropic>=0.40"]
embed-openai = ["openai>=1.40"]
embed-cohere = ["cohere>=5.0"]
auth-jwt = ["PyJWT>=2.8", "cryptography>=42"]
auth-redis = ["redis>=5"]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
creds-aws = ["boto3>=1.34"]
rerank-local = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vectorsmith_cli", "vectorsmith"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
