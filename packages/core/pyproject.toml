[project]
name = "vectorsmith-core"
version = "0.2.2"
description = "VectorSmith core: tools.yaml compiler, validators, and store adapters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "VectorSmith contributors" }]
keywords = ["mcp", "agents", "vector-database", "qdrant", "tools.yaml"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml",
    "jsonschema",
    "polars>=1.0",
    "lark",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/kjgpta/vectorsmith"
Documentation = "https://kjgpta.github.io/vectorsmith/"
Issues = "https://github.com/kjgpta/vectorsmith/issues"
Changelog = "https://github.com/kjgpta/vectorsmith/blob/main/CHANGELOG.md"

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.10.1", "fastembed>=0.3"]
pgvector = ["psycopg[binary,pool]>=3.2.1"]
chroma = ["chromadb>=1.5,<2", "numpy<2"]
pinecone = ["pinecone>=5.0"]
weaviate = ["weaviate-client>=4.16.9"]
milvus = ["pymilvus>=2.6"]
embed = ["fastembed>=0.3"]
embed-openai = ["openai>=1.40"]
embed-cohere = ["cohere>=5.0"]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
creds-aws = ["boto3>=1.34"]
rerank-local = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vectorsmith_core"]
