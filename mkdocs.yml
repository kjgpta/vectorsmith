site_name: VectorSmith
site_description: Your vector database, as typed tools an agent can actually use.
site_url: https://kjgpta.github.io/vectorsmith/
site_author: VectorSmith contributors

repo_url: https://github.com/kjgpta/vectorsmith
repo_name: kjgpta/vectorsmith
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kjgpta/vectorsmith
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vectorsmith/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - autorefs

exclude_docs: |
  /README.md
  /includes/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Vector stores: vector-stores.md
  - Backend conformance: conformance.md
  - Use in an agent: use-in-agents.md
  - Integrations:
      - Overview: integrations/README.md
      - Claude Desktop: integrations/claude-desktop.md
      - Claude Code: integrations/claude-code.md
      - OpenAI Codex: integrations/openai-codex.md
      - Cursor: integrations/cursor.md
      - LangChain: integrations/langchain.md
      - LangGraph: integrations/langgraph.md
      - OpenAI Agents: integrations/openai-agents.md
      - Anthropic: integrations/anthropic.md
      - Other frameworks: integrations/other-frameworks.md
  - Desktop: quickstart-desktop.md
  - HTTP / claude.ai: quickstart-selfhost.md
  - Coexistence: coexistence.md
  - tools.yaml: tools-yaml-reference.md
  - Library surface: library.md
  - CLI: cli.md
  - Python API: python-api.md
  - Enterprise: enterprise.md
  - Security hardening: security-hardening.md
  - Embedding providers: embedding-providers.md
  - Observability: observability.md
  - Kubernetes: deploy/kubernetes.md
  - Architecture: architecture.md
  - FAQ: faq.md
  - Repository map: repository.md
  - Changelog: changelog.md
  - Contributing: contributing.md

watch:
  - docs/
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
